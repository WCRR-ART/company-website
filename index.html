
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>我的第一个公网网站</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #1e293b;
        }

        nav {
            background: #0f172a;
            color: white;
            padding: 20px 8%;
            font-size: 22px;
            font-weight: bold;
        }

        .hero {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 18px;
        }

        .hero p {
            font-size: 18px;
            color: #cbd5e1;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 26px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000a;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <nav>Company Website</nav>

    <div class="hero">
        <h1>欢迎来到我的网站</h1>
        <p>这是一个部署在 GitHub Pages 上的网站</p>

        <a class="button" href="#about">
            了解更多
        </a>
    </div>

    <main>
        <div class="card" id="about">
            <h2>关于我们</h2>
            <p>我们专注于技术创新和软件开发。</p>
        </div>

        <div class="card">
            <h2>产品与服务</h2>
            <p>这里将展示我们的产品与解决方案。</p>
        </div>

        <div class="card">
            <h2>联系我们</h2>
            <p>欢迎通过 GitHub 了解我们的项目。</p>
        </div>
    </main>

    <footer>
        © 2026 My Website
    </footer>
</body>
</html>
